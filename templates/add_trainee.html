{% extends 'base.html' %}
{% block content %}
    <h2>Add New Trainee</h2>
    <form method="POST">
        {% csrf_token %}
        <p>Name: <input type="text" name="name" required></p>
        <p>Track: <input type="text" name="track" required></p>
        <button type="submit">Insert Trainee</button>
    </form>
{% endblock %}
