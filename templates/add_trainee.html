{% extends 'base.html' %}

{% block title %}Add Trainee{% endblock %}

{% block content %}
    <h2>Add Trainee</h2>
    <form method="POST" action="{% url 'add_trainee' %}">
        {% csrf_token %}
        <label>Name:</label>
        <input type="text" name="name"><br><br>
        <label>Track:</label>
        <input type="text" name="track"><br><br>
        <button type="submit">Submit (Will trigger dummy Redirect)</button>
    </form>
{% endblock %}
