{% extends 'base.html' %}
{% block content %}
    <h2>Add New Trainee</h2>
<form method="POST">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="trainee_name" class="form-control mb-3">

    <label>Select Course:</label>
    <select name="course_id" class="form-select mb-3">
        <option value="">-- Choose Course --</option>
        {% for c in courses %}
            <option value="{{ c.id }}">{{ c.title }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="btn btn-primary">Add Trainee</button>
</form>
{% endblock %}
