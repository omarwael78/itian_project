{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Trainee List</h2>
        <a href="{% url 'add_trainee' %}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add New Trainee
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Track</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for t in trainees %}
                    <tr>
                        <td>{{ t.id }}</td>
                        <td>
                            <a href="{% url 'trainee_detail' t.id %}" class="text-decoration-none fw-bold">
                                {{ t.name }}
                            </a>
                        </td>
                        <td><span class="badge bg-info text-dark">{{ t.track }}</span></td>
                        <td class="text-center">
                            <a href="{% url 'delete_trainee' t.id %}" 
                               class="btn btn-danger btn-sm" 
                               onclick="return confirm('Are you sure you want to delete {{ t.name }}?')">
                                <i class="fas fa-trash"></i> Hard Delete
                            </a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted">No trainees found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
