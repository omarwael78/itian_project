{% extends 'base.html' %}

{% block title %}Add Course{% endblock %}

{% block content %}
    <h2>Add Course</h2>
    <form method="POST" action="{% url 'add_course' %}">
        {% csrf_token %}
        <label>Course Name:</label>
        <input type="text" name="name"><br><br>
        <button type="submit">Submit</button>
    </form>
{% endblock %}
