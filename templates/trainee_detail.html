{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Trainee Details</h2>
    <div class="card shadow-sm p-4">
        <p><strong>ID:</strong> {{ trainee.id }}</p>
        <p><strong>Name:</strong> {{ trainee.name }}</p>
        <p><strong>Track:</strong> {{ trainee.track }}</p>
        <a href="{% url 'trainee_list' %}" class="btn btn-secondary">Back to list</a>
    </div>
</div>
{% endblock %}
