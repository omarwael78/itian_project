{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Add New Trainee (Day 3 - ModelForm)</h2>
    
    <form method="post" enctype="multipart/form-data" class="mt-3"> 
        {% csrf_token %}
        
        {{ form.as_p }} 
        
        <button type="submit" class="btn btn-success">Save Trainee</button>
    </form>
    
    <br>
    <a href="{% url 'trainee_list' %}" class="btn btn-secondary">Back to List</a>
</div>
{% endblock %}
