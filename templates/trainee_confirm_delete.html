{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Confirm Delete</h2>
    <p>Are you sure you want to delete <strong>{{ trainee.name }}</strong>?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'trainee_detail' trainee.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
